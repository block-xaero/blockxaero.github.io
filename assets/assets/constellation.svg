<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Subtle glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Stronger glow for center node -->
    <filter id="centerGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Gradient for center node -->
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#66D9EF"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </radialGradient>
    
    <style>
      /* Center pulse - subtle breathing */
      @keyframes centerPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      
      /* Data packets flowing inward */
      @keyframes flowTL {
        0% { offset-distance: 0%; opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      
      @keyframes flowTR {
        0% { offset-distance: 0%; opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      
      @keyframes flowBottom {
        0% { offset-distance: 0%; opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      
      /* Node subtle pulse */
      @keyframes nodePulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.9; }
      }
      
      .center-group {
        transform-origin: 200px 200px;
        animation: centerPulse 3s ease-in-out infinite;
      }
      
      .packet-tl {
        offset-path: path('M145 120 L200 200');
        animation: flowTL 2.5s ease-in-out infinite;
      }
      
      .packet-tr {
        offset-path: path('M255 120 L200 200');
        animation: flowTR 2.5s ease-in-out infinite 0.5s;
      }
      
      .packet-bottom {
        offset-path: path('M200 280 L200 200');
        animation: flowBottom 2.5s ease-in-out infinite 1s;
      }
      
      .outer-node {
        animation: nodePulse 3s ease-in-out infinite;
      }
      
      .outer-node-tl { animation-delay: 0s; }
      .outer-node-tr { animation-delay: 0.4s; }
      .outer-node-bottom { animation-delay: 0.8s; }
      
      .edge {
        stroke: #66D9EF;
        stroke-opacity: 0.3;
      }
    </style>
  </defs>
  
  <!-- Y Constellation Edges -->
  <g fill="none" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)">
    <line class="edge" x1="200" y1="200" x2="145" y2="120"/>
    <line class="edge" x1="200" y1="200" x2="255" y2="120"/>
    <line class="edge" x1="200" y1="200" x2="200" y2="280"/>
  </g>
  
  <!-- Data packets -->
  <circle class="packet-tl" r="3" fill="#66D9EF" filter="url(#glow)"/>
  <circle class="packet-tr" r="3" fill="#66D9EF" filter="url(#glow)"/>
  <circle class="packet-bottom" r="3" fill="#66D9EF" filter="url(#glow)"/>
  
  <!-- Outer nodes -->
  <g filter="url(#glow)">
    <!-- Top-left node -->
    <g class="outer-node outer-node-tl">
      <circle cx="145" cy="120" r="8" fill="#004d4d"/>
      <circle cx="145" cy="120" r="5" fill="#66D9EF"/>
      <circle cx="145" cy="120" r="2" fill="#b2ebf2"/>
    </g>
    
    <!-- Top-right node -->
    <g class="outer-node outer-node-tr">
      <circle cx="255" cy="120" r="8" fill="#004d4d"/>
      <circle cx="255" cy="120" r="5" fill="#66D9EF"/>
      <circle cx="255" cy="120" r="2" fill="#b2ebf2"/>
    </g>
    
    <!-- Bottom node -->
    <g class="outer-node outer-node-bottom">
      <circle cx="200" cy="280" r="8" fill="#004d4d"/>
      <circle cx="200" cy="280" r="5" fill="#66D9EF"/>
      <circle cx="200" cy="280" r="2" fill="#b2ebf2"/>
    </g>
  </g>
  
  <!-- Center node (main pulse) -->
  <g class="center-group" filter="url(#centerGlow)">
    <circle cx="200" cy="200" r="14" fill="#003d3d"/>
    <circle cx="200" cy="200" r="10" fill="url(#centerGrad)"/>
    <circle cx="200" cy="200" r="5" fill="#b2ebf2"/>
    <circle cx="200" cy="200" r="2" fill="#ffffff"/>
  </g>
</svg>
